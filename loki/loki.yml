# Credentials here must match MINIO_ROOT_USER / MINIO_ROOT_PASSWORD in .env
# Storage pattern mirrors thanos/objstore.yml — both use MinIO's S3 API
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
  aws:
    endpoint: minio:9000
    region: us-east-1
    bucketnames: loki-data
    access_key_id: thanos
    secret_access_key: changeme
    insecure: true
    s3forcepathstyle: true

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20

analytics:
  reporting_enabled: false
