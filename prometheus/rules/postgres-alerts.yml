groups:
  - name: postgres-alerts
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "postgres-exporter cannot reach PostgreSQL (instance {{ $labels.instance }})."

      - alert: PostgresTooManyConnections
        expr: |
          pg_stat_activity_count > (pg_settings_max_connections * 0.8)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection count is high"
          description: "PostgreSQL has {{ $value }} active connections, exceeding 80% of max_connections."

      - alert: PostgresDeadlocks
        expr: |
          rate(pg_stat_database_deadlocks_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "Database {{ $labels.datname }} is experiencing {{ $value | humanize }} deadlocks/sec over the last 5 minutes."

      - alert: PostgresSlowQueries
        expr: |
          pg_stat_activity_max_tx_duration{datname!~"template.*"} > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Long-running PostgreSQL transaction"
          description: "Database {{ $labels.datname }} has a transaction running for more than 5 minutes (current: {{ $value | humanizeDuration }})."

      - alert: PostgresCacheHitRateLow
        expr: |
          (
            pg_stat_database_blks_hit{datname!~"template.*"}
            /
            (pg_stat_database_blks_hit{datname!~"template.*"} + pg_stat_database_blks_read{datname!~"template.*"})
          ) < 0.95
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL cache hit rate is low"
          description: "Database {{ $labels.datname }} cache hit rate is {{ $value | humanizePercentage }} (below 95% threshold)."

      - alert: PostgresExporterDown
        expr: up{job="postgres-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter is down"
          description: "postgres-exporter instance {{ $labels.instance }} has been unreachable for more than 1 minute."
